name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v0.2.6"
        required: true

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.13"

jobs:
  release:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify manually selected tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git rev-parse --verify "refs/tags/${RELEASE_TAG}" >/dev/null
          if [[ "$(git rev-list -n 1 "${RELEASE_TAG}")" != "${GITHUB_SHA}" ]]; then
            echo "${RELEASE_TAG} does not point to the selected workflow commit."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Verify source version matches release tag
        working-directory: apps/desktop
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          node -e '
            const fs = require("node:fs");
            const version = process.env.RELEASE_TAG.replace(/^v/, "");
            if (!/^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(version)) {
              throw new Error(`Invalid release tag version: ${process.env.RELEASE_TAG}`);
            }

            const versions = {
              "package.json": JSON.parse(fs.readFileSync("package.json", "utf8")).version,
              "src-tauri/tauri.conf.json": JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version,
              "src-tauri/Cargo.toml": (fs.readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version = "([^"]+)"$/m) || [])[1],
              "../../pyproject.toml": (fs.readFileSync("../../pyproject.toml", "utf8").match(/^version = "([^"]+)"$/m) || [])[1],
            };
            const mismatches = Object.entries(versions)
              .filter(([, actual]) => actual !== version)
              .map(([file, actual]) => `${file} is ${actual || "missing"}`);
            if (mismatches.length) {
              throw new Error(`Source version must match ${process.env.RELEASE_TAG}: ${mismatches.join(", ")}`);
            }
          '

      - name: Build backend sidecar
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          uv sync --locked --group dev

          PYINSTALLER_COLLECT_ARGS=(
            --collect-all alembic
            --collect-all apscheduler
            --collect-all certifi
            --collect-all charset_normalizer
            --collect-all cssselect
            --collect-all DataRecorder
            --collect-all DownloadKit
            --collect-all DrissionPage
            --collect-all DrissionGet
            --collect-all DrissionRecord
            --collect-all faker
            --collect-all fastapi
            --collect-all filelock
            --collect-all httpx
            --collect-all loguru
            --collect-all lxml
            --collect-all multipart
            --collect-all openpyxl
            --collect-all psutil
            --collect-all pydantic
            --collect-all pydantic_settings
            --collect-all requests
            --collect-all requests_file
            --collect-all sqlalchemy
            --collect-all sqlmodel
            --collect-all tldextract
            --collect-all urllib3
            --collect-all uvicorn
            --collect-all websocket
            --collect-all websockets
          )
          PYINSTALLER_HIDDEN_IMPORTS=(
            --hidden-import collections.abc
            --hidden-import dataclasses
            --hidden-import enum
            --hidden-import html
            --hidden-import html.entities
            --hidden-import html.parser
            --hidden-import json
            --hidden-import random
            --hidden-import re
            --hidden-import string
            --hidden-import time
            --hidden-import typing
            --hidden-import urllib
            --hidden-import urllib.parse
          )

          uv run pyinstaller \
            --clean \
            --onefile \
            --name "nexus-flow-api-${TARGET_TRIPLE}" \
            --paths backend \
            "${PYINSTALLER_COLLECT_ARGS[@]}" \
            "${PYINSTALLER_HIDDEN_IMPORTS[@]}" \
            backend/app/run.py

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            NEXUS_FLOW_API_IMPORT_CHECK=1 "dist/nexus-flow-api-${TARGET_TRIPLE}.exe"
            mv "dist/nexus-flow-api-${TARGET_TRIPLE}.exe" "apps/desktop/src-tauri/binaries/nexus-flow-api-${TARGET_TRIPLE}.exe"
          else
            chmod +x "dist/nexus-flow-api-${TARGET_TRIPLE}"
            NEXUS_FLOW_API_IMPORT_CHECK=1 "dist/nexus-flow-api-${TARGET_TRIPLE}"
            mv "dist/nexus-flow-api-${TARGET_TRIPLE}" "apps/desktop/src-tauri/binaries/nexus-flow-api-${TARGET_TRIPLE}"
            chmod +x "apps/desktop/src-tauri/binaries/nexus-flow-api-${TARGET_TRIPLE}"
          fi

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseCommitish: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.sha }}
          releaseName: Nexus Flow ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseBody: "Desktop builds for macOS and Windows."
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
